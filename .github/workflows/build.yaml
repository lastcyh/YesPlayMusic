name: Build Windows

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
  workflow_dispatch:

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

env:
  VUE_APP_NETEASE_API_URL: /api
  VUE_APP_ELECTRON_API_URL: /api
  VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
  VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
  VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install dependencies
        shell: bash
        run: yarn install --ignore-optional

      - name: Read UnblockNeteaseMusic version
        id: unm
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install win32-x64 native binding
        shell: bash
        run: yarn add --ignore-platform --ignore-optional @unblockneteasemusic/rust-napi-win32-x64-msvc@${{ steps.unm.outputs.version }}

      - name: Build installer
        shell: bash
        run: yarn electron:build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-windows
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 30
